<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terra Nova DX</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>

  <script src="src/config.js"></script>
  <script src="src/input.js"></script>
  <script src="src/level.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/save.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/tiles.js"></script>
  <script src="src/font.js"></script>
  <script src="src/backgrounds.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/player.js"></script>
  <script src="src/game.js"></script>
  <script src="src/screens.js"></script>
  <script src="src/hints.js"></script>
  <script>
    const canvas = document.getElementById('screen');

    // Escalado por el mayor factor entero que cabe en la ventana, para que los
    // píxeles queden nítidos y se mantenga la proporción.
    function fitCanvas() {
      const scale = Math.max(1, Math.floor(Math.min(
        innerWidth / TN.WIDTH,
        innerHeight / TN.HEIGHT
      )));
      canvas.style.width = TN.WIDTH * scale + 'px';
      canvas.style.height = TN.HEIGHT * scale + 'px';
    }
    addEventListener('resize', fitCanvas);
    fitCanvas();

    const game = new TN.Game(canvas);
    game.start();

    // El sonido arranca con la primera tecla o clic (norma de los navegadores).
    addEventListener('keydown', () => game.sound.start());
    addEventListener('pointerdown', () => game.sound.start());

    // F: pantalla completa.
    addEventListener('keydown', (e) => {
      if (e.code !== 'KeyF') return;
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    });
  </script>
</body>
</html>
